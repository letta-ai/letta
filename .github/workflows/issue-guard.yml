name: "Close Issues"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect to the current repository
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = [
              `This repository contains the retired Letta V1 server and does not accept new issues or changes.`,
              ``,
              `For current Letta development, bug reports, and feature requests, use [letta-ai/letta-code](https://github.com/letta-ai/letta-code/issues).`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              lock_reason: 'off-topic',
            });

            console.log(`Issue #${issue.number} redirected, closed, and locked`);
