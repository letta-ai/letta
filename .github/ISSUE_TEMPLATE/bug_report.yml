name: Bug Report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **Reporting a bug with Letta Code?**
        > Please file your issue at **[letta-ai/letta-code](https://github.com/letta-ai/letta-code/issues)** instead!
        > This repository is for the core Letta server only.

  - type: checkboxes
    id: third-party-product
    attributes:
      label: Third-Party Product Disclosure
      description: Select **exactly one** option. If this issue mentions a third-party product or service, disclose your relationship to it below.
      options:
        - label: This issue does not mention or promote a third-party product or service
        - label: This issue mentions a third-party product or service, and I have disclosed my relationship to it below
    validations:
      required: true

  - type: input
    id: third-party-relationship
    attributes:
      label: Relationship to Third-Party Product or Service
      description: State whether you are the creator, employee, contractor, investor, affiliate, sponsor, paid promoter, user, or customer. State `No relationship` if you are unaffiliated, or `Not applicable` if no third-party product or service is mentioned.
      placeholder: "e.g. Creator, employee, affiliate, no relationship, or not applicable"
    validations:
      required: true

  - type: checkboxes
    id: anti-spam-acknowledgment
    attributes:
      label: Anti-Spam Acknowledgment
      options:
        - label: I understand that self-promotional spam, advertising, lead generation, affiliate or referral pitches, and deceptive disclosures will be reported to GitHub as spam, and the account will be blocked from this repository
          required: true
    validations:
      required: true

  - type: checkboxes
    id: ai-disclosure
    attributes:
      label: AI Disclosure
      description: |
        We require all issue authors to disclose AI usage per our [AI Policy](https://github.com/letta-ai/letta/blob/main/AI_POLICY.md).
        Select **exactly one** authorship option, identify every AI tool used below, and acknowledge the policy.
      options:
        - label: This issue was written entirely by a human
        - label: This issue was written with AI assistance and **reviewed and edited by a human**
        - label: I have read the [AI Policy](https://github.com/letta-ai/letta/blob/main/AI_POLICY.md) and agree to its terms
          required: true
    validations:
      required: true

  - type: input
    id: ai-tools
    attributes:
      label: AI Tool(s) Used
      description: List every AI tool used to research or write this issue (for example, Claude Code, Cursor, Copilot, or ChatGPT). If no AI tool was used, enter `None`.
      placeholder: "e.g. Claude Code and ChatGPT, or None"
    validations:
      required: true

  - type: textarea
    id: repository-acknowledgment
    attributes:
      label: Repository Acknowledgment
      description: |
        Read [AGENTS.md](https://github.com/letta-ai/letta/blob/main/AGENTS.md), then copy and paste the following phrase **exactly**:
        `I have read AGENTS.md and understand that issues about the current Letta server, agent harness, CLI, or channel integrations belong in letta-ai/letta-code, not this repository.`
      placeholder: "I have read AGENTS.md and understand that issues about the current Letta server, agent harness, CLI, or channel integrations belong in letta-ai/letta-code, not this repository."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Letta?
      options:
        - Docker
        - From source
        - Desktop
        - pip (legacy)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 15.4, Ubuntu 24.04, Windows 11

  - type: input
    id: version
    attributes:
      label: Letta Version
      description: Run `letta version` or check your Docker image tag.
      placeholder: e.g. 0.16.7

  - type: input
    id: model
    attributes:
      label: Model
      description: Which LLM model are you using?
      placeholder: e.g. gpt-4o, claude-sonnet-4-20250514, local llama

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start Letta server with ...
        2. Create an agent with ...
        3. Send message ...
        4. See error ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste any relevant log output, error messages, or screenshots.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem. Attach `.af` agent files if applicable.
